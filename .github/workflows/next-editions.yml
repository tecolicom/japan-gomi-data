name: next-editions

# 収録済み自治体の一次ソースを見に行き、「次の版が公開されたか」を一覧に落とす。
# 収録データの寿命 (period) が切れる前に気づくための仕組み。判定は候補出しまでで、
# 収録そのものは人が判断する。
#
# 出力ファイルの git 履歴が、そのまま「どの自治体がいつ公開したか」の記録になる。

on:
  schedule:
    # 毎週月曜 09:00 JST (= 00:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    # webhook は job レベルで公開する。step 自身の env: は、その step の if: の評価時点では
    # 参照できない (if が先に評価される) ため、step 側に置くと通知が常にスキップされる。
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci

      - name: 一次ソースを確認
        run: node scripts/check-new-editions.mjs

      - name: 結果をジョブサマリに出す
        run: |
          {
            echo '### 次の版の公開状況'
            echo
            sed -n '/## 公開を検出/,/^## /p' docs/next-edition-status.md | sed '$d'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 変化があればコミット
        run: |
          if git diff --quiet -- docs/next-edition-status.md; then
            echo "状態に変化なし — コミットしない (毎週の空コミットで履歴を汚さない)"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/next-edition-status.md
          git commit -m 'chore(watch): 次の版の公開状況を更新'
          git push

      # 検出を Issue に落とす。secret を要さずリポジトリ内で完結するので、これが既定の通知経路。
      # (Discord は下の step。webhook 未設定なら黙って飛ぶため、それだけだと検出が沈黙する)
      #
      # 検出状態は「人が次の版を収録するまで」続く。毎週立て直すと同じ Issue が積み上がるので、
      # 未対応の open が既にあれば何もしない。中身の正典は docs/next-edition-status.md 側。
      - name: 検出時に Issue を立てる
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FOUND=$(sed -n '/## 公開を検出/,/^## /p' docs/next-edition-status.md | grep -c '^- \*\*' || true)
          if [ "$FOUND" -eq 0 ]; then
            echo "検出なし — Issue を立てない"
            exit 0
          fi
          if [ -n "$(gh issue list --label next-edition --state open --json number --jq '.[].number')" ]; then
            echo "未対応の Issue が既にある — 立て直さない"
            exit 0
          fi
          # ラベルは初回だけ作られる。既にあれば失敗するので握りつぶす。
          gh label create next-edition --color '0e8a16' \
            --description '一次ソースに次の版が出ている (収録候補)' 2>/dev/null || true
          {
            sed -n '/## 公開を検出/,/^## /p' docs/next-edition-status.md | sed '$d'
            echo
            echo '---'
            echo '自動生成。判定は候補出しまでで、収録するかは人が決める。'
            echo '最新の状態は `docs/next-edition-status.md` を見ること。'
            echo '収録したらこの Issue を閉じる (開いたままだと次の検出が通知されない)。'
          } > /tmp/issue-body.md
          gh issue create --title "次の版が公開された自治体があります ($FOUND 件)" \
            --label next-edition --body-file /tmp/issue-body.md

      # Discord への通知は「公開を検出」が出たときだけ。secret が無ければ黙って飛ばす。
      - name: 検出時に Discord へ通知
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        run: |
          FOUND=$(sed -n '/## 公開を検出/,/^## /p' docs/next-edition-status.md | grep -c '^- \*\*' || true)
          if [ "$FOUND" -eq 0 ]; then
            echo "検出なし — 通知しない"
            exit 0
          fi
          BODY=$(sed -n '/## 公開を検出/,/^## /p' docs/next-edition-status.md | sed '$d' | head -c 1500)
          jq -n --arg c "🗑 次の版が公開された自治体があります ($FOUND 件)"$'\n\n'"$BODY" '{content: $c}' \
            | curl -sS -X POST -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK"
