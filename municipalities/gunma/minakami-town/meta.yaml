handle: minakami-town
name_ja: みなかみ町
region_ja: 群馬県
code: "10449"
source:
  index_url: https://www.town.minakami.gunma.jp/life/09sumai/gomi/2017-0117-1345-71.html
notes:
  # course-*.yaml は tools/pdf-extractor/minakami-town が生成する。直したいときは生成器を直して make regen する
  - "一次ソース: 町公式「令和8年度後期(令和8年10月～令和9年3月)予定表」の地区別カレンダー PDF。収録期間 2026-10--2027-03 は案内ページの見出しそのもの。町は半期ごとに版を出す (4月起点の前期・10月起点の後期)"
  - "収録したのは水上地区 6 枚・月夜野地区 9 枚。1 PDF = 1 course (course 値は PDF のファイル名の地区と番号)。日程がまったく同じ tsukiyono-2 (後閑（上河原地区）) と tsukiyono-9 (下牧) も畳まない (照合を PDF と 1:1 に保つ)"
  - "**新治地区 (niiharu_1〜3) は収録していない。** 資源物の欄が「行政区によって決められています。その日時にしたがって出してください」と「－」だけで、日付表にも印が無い。毎週の品目だけ収録すると資源物を収集しないように読めるため見送った (survey.yaml 参照)"
  - "minakami-1-sudagai は minakami_1 の注記「※須田貝・青木沢地区のプラスチックは毎週火曜日に収集します。」から作った course。注記が言うのはプラスチックだけなので、燃やせないごみは水曜のまま。「12月30日は除く」は水曜の文なので、火曜のプラスチックには休止を付けていない (一次ソースに書かれていない)"
  - "須田貝・青木沢がどの大字・行政区に含まれるかは資料に無い (ABR にも無い)。藤原の中の地区と思われるが確かめていないので、minakami-1 の area に注記は付けていない"
  # areas
  - "areas は PDF の見出しに印刷された地区名 (行政区) をそのまま使う。生活の実態に合った単位であればよく、正式な住所である必要はない (docs/playbook.md「areas の作り方」)"
  - "yomi と machiaza_id は ABR 町字マスター (群馬県版、lg_code 104493、44 大字) と名前が完全一致したときだけ付けた。括弧書き (後閑（上河原地区）・上組（真沢地区）) は括弧の前の名前で引く。一致は水上 15/15、月夜野 8/24 (後閑（上河原地区）を含む)。読みの推測はしていない"
  - "ABR と一致しない月夜野の地区名: 真政・小川島・南区・竹改戸・中村・上区・下区・町組・上組・大峰・上組（真沢地区）・渕尻・和名中・小和知・下石倉・上石倉。ABR の大字のうち上津・下津・月夜野・真庭・政所・向山・夜後・吉本・石倉などはどの地区名にもそのまま出てこない。行政区と大字の対応表が無いので、町全体を覆っているかは検査できない"
  - "案内ページのリンク文言は minakami_2 を「湯桧曽・大穴区・高日向」と書くが、PDF の見出しは「湯桧曽・大穴・高日向」。area は PDF の見出しに従った (ABR の大字も「大穴」)"
  # 日程の読み方
  - "表の 5 行: ● 生ごみ・燃やせるごみ (毎週 2 回) / プラスチック・燃やせないごみ (毎週水曜) / ■ かん・びん・ペットボトル (毎月 2 回) / ▲ 電池類・蛍光管類・古紙類 (毎月 2 回) / 衣 衣類 (10月と1月の第3)。規則は表の文から作る"
  - "年末年始: 表の文の「1月1日を除く」(火・金の地区)・「12月31日を除く」(月・木の地区)・「12月30日は除く」(水曜) を cancelled にした。それ以外の祝日は通常どおり収集 (日付表の印も 2/11 などの祝日に付いている)"
  - "月夜野の 3 枚 (tsukiyono-4・6・7。金曜の地区) は 1 月だけ回数が変わる: かん・びん・ペットボトルは「1月は第2・4金曜」、電池類・蛍光管類・古紙類は「1月は第3・5金曜」。category override で表した"
  - "日付表の下の ※ (月夜野) は集積所の一覧で、日程の情報は無い。地区より細かい地名 (上真庭・下師など) が出てくるが、収録には使っていない"
  # 検証記録
  - "2026-10-22 照合: 規則は表の文から作り、同じ PDF の日付表の印 (■▲衣) と全 182 日を突き合わせた。15 枚 × 182 日 = 2,730 日枠で不一致 0 → 95% 信頼で <0.11%/日枠。表の規則行 45 行で不一致 0 → <6.7%/行 (rule of three)。日付表は同じ PDF の別表現で、外部の独立ソースではない"
  - "毎週の品目 (燃やせるごみ・生ごみ・プラスチック・燃やせないごみ) は日付表に印が無く、表の文による自己照合しかできない"
  - "照合が効くことは改竄で確かめた: 生成物で衣類を 1 日消す・1 日足す・12/31 の休止を外す・1 月の差し替えを別品目にする → verify がそれぞれ差分を出す。一次ソース側で日付表の印を 1 つ消す・1 つ足す・表の文の曜日を書き換える → build がそれぞれ止まる"
