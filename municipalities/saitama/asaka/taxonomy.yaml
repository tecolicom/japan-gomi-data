# 朝霞市。公式「家庭ごみ収集日一覧表」の4区分を正典語彙へ割り当てる(語彙追加なし)。
# 全域 朝霞市クリーンセンター単一・全品目 weekly。
#  燃やすごみ(週2)=burnable / プラスチック資源(容器包装プラ,週1)=plastic /
#  燃やせないごみと有害ごみ(週1・同日)=non_burnable+hazardous /
#  資源(びん・缶・ペットボトル・古紙・古布を週1で同日一括)=glass_bottle+beverage_can+pet_bottle+paper+cloth
categories:
  - burnable
  - plastic
  - non_burnable
  - hazardous
  - glass_bottle
  - beverage_can
  - pet_bottle
  - paper
  - cloth
overrides:
  burnable:
    label: 燃やすごみ
  plastic:
    label: プラスチック資源
    short: プラ
  non_burnable:
    label: 燃やせないごみ
  hazardous:
    label: 有害ごみ
  glass_bottle:
    label: びん
  beverage_can:
    label: 缶
  pet_bottle:
    label: ペットボトル
  paper:
    label: 古紙
  cloth:
    label: 古布

# 参考情報: 市の括り名 (同日収集の呼称)。データ本体は構成カテゴリへ分解済み。
groups:
  - label: 資源
    members: [glass_bottle, beverage_can, pet_bottle, paper, cloth]
    note: びん・缶・ペットボトル・古紙・古布を同じ「資源」の日に一括収集
  - label: 燃やせないごみと有害ごみ
    short: 燃やせない・有害
    members: [non_burnable, hazardous]
    note: 燃やせないごみと有害ごみ(乾電池・蛍光管・スプレー缶等)を同日に収集
