# 朝霞市の読み物断片 (facts)。事実と出典に基づく。文体: です・ます調、2〜4 文。
facts:
  - id: boundary-split-collection
    title: 川や線路の「どちら側」で収集日が変わる
    body: >-
      朝霞市では、黒目川や東武東上線、県道和光志木線などを境に、同じ町でも収集日が分かれる地区が
      あります。たとえば大字溝沼は東武東上線の北側と南側で分かれ、南側はさらに黒目川の右岸・左岸で
      日程が違います。引っ越しのときは、町名だけでなく川や線路のどちら側かも確かめる必要があります。
    scope: city
    tags: [町内の違い, 境界線]
    sources:
      - https://www.city.asaka.lg.jp/soshiki/15/dust-syuusyuu.html (家庭ごみ収集日一覧表)
  - id: container-plastic-only
    title: プラは容器包装だけ、製品プラは燃やすごみ
    body: >-
      朝霞市で「プラスチック資源」として集めるのは、プラマークのついた容器や包装だけです。バケツや
      おもちゃなどのプラスチック製品は燃やすごみに出します。練馬区など多くの自治体と同じ方式で、
      横浜市が 2025 年に全区で始めた製品プラの分別回収は、朝霞市ではまだ行われていません。
    scope: city
    tags: [分別体系, プラスチック]
    sources:
      - https://www.city.asaka.lg.jp/soshiki/15/dust-katei.html (資源とごみの分け方・出し方)
  - id: shigen-weekly-batch
    title: びん・缶・古紙などは同じ日にまとめて出す
    body: >-
      びん・缶・ペットボトル・古紙・古布は、種類ごとに別の日ではなく「資源」の日にまとめて週1回
      収集されます。資源を月1回にする倉敷市などと比べると回収は多めですが、品目ごとに容器を分けて
      同じ日に出す必要があります。
    tags: [資源の中身, 収集頻度]
    sources:
      - https://www.city.asaka.lg.jp/soshiki/15/dust-katei.html (資源とごみの分け方・出し方)
