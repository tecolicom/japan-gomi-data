handle: asaka
name_ja: 朝霞市
region_ja: 埼玉県
code: "11227"
source:
  index_url: https://www.city.asaka.lg.jp/soshiki/15/dust-katei.html
  schedule_url: https://www.city.asaka.lg.jp/soshiki/15/dust-syuusyuu.html
  yearend_url: https://www.city.asaka.lg.jp/soshiki/15/dust-syuusyuu.html
notes:
  - "一次ソース: 朝霞市公式「家庭ごみ収集日一覧表」dust-syuusyuu.html の HTML 表(区域と 資源/プラスチック資源=燃やせないごみ/燃やすごみ の3曜日列、38町丁グループ)。CSV/PDF ダウンロードは無し。収集は全域 朝霞市クリーンセンター単一・全品目 weekly。市民団体 Publitech ASAKA の 5374版 area_days.csv(github.com/publitechasaka/5374、36行)は読み(yomi)併記があり照合・読み補完に使うが、大字溝沼の東上線北側区分と自衛隊(朝霞駐屯地)を欠くため一次には採らず、公式HTMLを一次ソースとした。"
  - "収録単位: 全域が単一クリーンセンター管内で、同一日程の地区を畳んで 6 コース(course-1〜6)に集約。course_name_ja は付けていない(全域単一・少数コースのため area 列挙で足りる)。"
  - "種別マッピング(taxonomy.yaml と一致、語彙追加なし): 燃やすごみ=burnable(週2曜日) / プラスチック資源=plastic(週1、容器包装プラのみ。プラ製品は燃やすごみ) / 燃やせないごみと有害ごみ=non_burnable+hazardous(週1・プラスチック資源と同曜日、乾電池・蛍光管・スプレー缶等の有害を燃やせないごみと同日収集) / 資源=市の分別定義どおり びん=glass_bottle・缶=beverage_can・ペットボトル=pet_bottle・古紙=paper・古布=cloth を同一日に一括収集するので5カテゴリの同日収集に分解(週1)。HTML表はプラスチック資源と燃やせないごみを1列(同曜日)で表す。"
  - "areas: HTML表の地名を tools/html-extractor/asaka/build.mjs で 1 町名へ分解。分解規約: 先頭「大字」接頭辞と別名併記「岡・大字岡」の後半は base から除く / 丁目(N丁目・N〜M丁目)は元表記を name に保持し machiaza_id 照合用に展開 / 番地・河川道路鉄道境界条件(「7番の一部(黒目川左岸)」「東上線北側」「東武東上線南側」)と「◯◯の一部」は note へ / 全角数字は半角へ正規化。割れ area(同名が境界で別コース: 溝沼・膝折町2丁目・浜崎 等)は note の判別子を name に昇格し「町名(判別子)」とする(横浜・倉敷と同規則)。"
  - "yomi・machiaza_id: yomi は 5374 CSV の読み併記(「青葉台 あおばだい」)由来で 37/38 付与(丁目細分行や CSV に無い地区は同一大字の読みで補完。自衛隊のみ ABR・CSV とも読みが無く未付与、推測しない)。machiaza_id はデジタル庁 ABR 町字マスター埼玉県版(pref11、lg 11227、fetch-yomi.mjs)由来で 25/38。ABR が住居表示ベースのため大字行を持たない農村部の広域大字(上内間木・下内間木・宮戸・台・根岸)と、丁目化された町の大字部分の割れ(大字浜崎・大字溝沼)、および自衛隊は machiaza_id 無し(推測で付けない)。ABR は政府標準利用規約(CC BY 4.0 互換)。"
  - "割れ(同名が別コース): 黒目川・東武東上線・県道和光志木線などの境界で同一町の収集日が分かれる(飯能の「道路のどちら側か」と同型)。例: 大字溝沼=東上線北側/(南側×黒目川右岸)/(南側×黒目川左岸)の3コース、膝折町2丁目=番地(黒目川右岸/左岸)で2コース、大字浜崎=県道和光志木線北側/東武東上線南側。境界記述は公式HTMLの表現(右岸/左岸・東上線)を採用(5374 CSV は同じ境界を黒目川の東/西で表すが指す区域と日程は一致)。"
  - "年末年始: HTML表に「祝日も収集します(年末年始を除く)」と明記(december-announce 型)。年末年始の実日付休止は毎年12月に別途告知の運用で一次ソースに載らないため cancelled override は作らない(推測で作らない)。course は恒常的な曜日スケジュールで year=2026 は名目値。"
  - "粗大ごみ: 別途申込・有料で集積所対象外 → rules 非対象。使用済乾電池等の有害は「燃やせないごみと有害ごみ」の日に収集し hazardous に含める。"
  - "検証(2026-08-01): 公式HTML「家庭ごみ収集日一覧表」の3曜日列と、5374 area_days.csv の4分別曜日を全地区で独立照合。CSV と共通の34地区は資源・プラ(=燃やせない)・燃やすの曜日が完全一致(HTMLのプラスチック資源列=CSVのプラスチック資源=燃やせないごみと有害ごみ が同曜日であることも確認)。CSV が欠く大字溝沼の東上線北側区分・自衛隊は公式HTMLを採用。境界表記の違い(HTML右岸/左岸・東上線 ⇔ CSV黒目川の東/西)は指す区域と日程が一致することを確認。日付入り年間カレンダーは市非公開のため日付レベルの独立照合は不可。"
  - "ライセンス: 収集日程データ自体の公開ライセンスは未確認(市サイト利用規約ページ 404、埼玉県ODポータルにごみ収集日程データセット無し)→ unknown。収集日という事実データの抽出として収録(練馬・杉並・所沢と同じ整理)。5374 area_days.csv は市データの転記(リポジトリのコードは MPL2.0 だが area_days.csv はデータ)。全国系アプリ「さんあ〜る」は第三者商用のため一次ソースに採らない。"
