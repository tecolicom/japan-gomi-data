notes: 収集主体は秩父広域市町村圏組合(5市町共同)、日程管理は秩父市生活衛生課。 市サイト /9098.html に地区別ごみカレンダーPDFを掲載。地区は 43分割 (秩父中央34・吉田4・大滝2・荒川3)、PDFは
  /secure/22218/01〜43 の番号+地区名.pdf。 PDF はテキスト層あり(pdftotext 抽出可、CLI 200)だが月別カレンダーのグリッド レイアウトで日番号と品目名が散在するため要パース=difficulty
  3。令和7年度版 (4月〜翌3月)のため年末年始も表内に含まれる想定(グリッド中の12/1月部分は 未詳細確認)。テキスト版カレンダー・収集曜日CSV/JSONは未発見。埼玉県OD ポータルにも秩父市のごみ収集日データセットは無し(県共同データセットも無し確認済)。
  組合サイト(c-kouiki.jp)のカレンダーは申込フォーム経由でPDF送付、直リンク無し だが検証用の独立系統として利用可。アプリ提供は未確認。

  【収録済 2026-08-03】全43地区を色ベース抽出で収録(course=01〜43、PDF番号に一致)。PDFは雑誌型InDesignで文字/座標抽出が不可のため、品目のセル背景色で判定する色ベース抽出(tools/pdf-extractor/chichibu-koiki)を用いた。全PDF共通テンプレートの各月グリッド四隅座標(01日野田町の矩形注釈から確定しextract.pyに埋め込み)から暦計算でセル座標を復元し、セル領域の色で品目判定(文字も日付も読まない)。収集頻度・曜日は地区で異なり(可燃=月木/火金/水土の3群、太田部は少頻度で可燃も月2)、実日付からweekly(+休止のcancelled)/monthly_specificを地区ごとに導出。生成規則を再展開して抽出実日付と品目ごと完全一致を自己検証。目視は日野田町(全月)+上宮地町(ペット月3)・太田部(少頻度)・三峰(山間で同日束ね多)をサンプル確認。横瀬/皆野/長瀞/小鹿野も同テンプレートで収録済(秩父広域5市町61地区)。 areas は playbook 準拠に整備済——連結地区名を1町名単位に分割し、ABR町字マスター(pref11)由来の yomi/machiaza_id を付与(秩父市中心部の町は全付与、山間の字級はname のみで推測カナ禁止)。割れ町は出典の(判別子)を name 昇格、判別子なしの割れ(久那25/43等)は下流の候補選択に委ねる。
