notes:
  - "一次ソース: 東秩父村公式「ごみの出し方」ページ(gominodashikata.html)の HTML 本文。種別ごとの収集曜日(第n含む)が文章で明記されており、地区割が無く村全域一律のため 1 コース。粗大ごみは自己搬入(小川地区衛生組合)で集積所対象外。ごみ処理は秩父広域市町村圏組合でなく小川地区の枠組。"
  - "種別マッピング(taxonomy.yaml と一致、語彙追加なし): 燃えるごみ(月・木)=burnable / 資源プラスチック(容器包装、第1・2・3・5金)と廃プラスチック(複合製品・皮・スポンジ等の製品プラ、第4金)は正典 plastic に統合(合わせて毎週金曜=weekly) / ガラス類(食器ガラス等、第3火)=non_burnable(村に不燃ごみ区分は無くガラス類がこれに相当) / 金属類(スチール缶・小型家電、第1火)=metal / 有害ごみ(スプレー缶・電池・蛍光管等、第2火)=hazardous / びん類(無色・茶色、第4火)=glass_bottle / ペットボトル(第3火)=pet_bottle / 資源回収(第2水=役場前・第4水=各ステーション)は 新聞雑誌段ボール牛乳パック=paper・衣類=cloth・アルミ缶=beverage_can に分解。"
  - "ペットボトルの季節変動: 通年の第3火に加え、5〜10月は第1水曜も収集する。第1水曜(2026年は5/6・6/3・7/1・8/5・9/2・10/7)を overrides に pet_bottle の追加収集として記録した(cancelled なし)。"
  - "年末年始: HTML本文に年末年始の休止・振替の記載が無く、cancelled override は作らない(推測で作らない)。course は恒常的な曜日/第n スケジュールで year=2026 は名目値。"
  - "検証: HTML本文の明示テキスト(種別=曜日)を転記。地区割・日付入りカレンダーが無いため機械照合の対象は無く、一次ソースの文言そのものが確度の担保。廃プラ・ガラス類のカテゴリ帰属は正典 categories.yaml に照らした判断(廃プラは製品プラだが正典 plastic はプラ全般、ガラス類は不燃相当)。"
  - "ライセンス: 収集日程データ自体の公開ライセンスは未確認(村サイト、埼玉県ODポータルに個別データセット無し)→ unknown。収集日という事実データの抽出として収録(練馬・杉並・所沢と同じ整理)。"
