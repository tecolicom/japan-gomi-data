notes: 'ごみ処理は秩父広域市町村圏組合(秩父市・横瀬町・皆野町・長瀞町・小鹿野町の5市町)が担うが、 収集日程カレンダーPDFは横瀬町公式サイトが町独自に公開している(組合サイトはPDF申込フォーム/各市町HP誘導のみで実ファイル無し)。
  令和8年度(2026)版、地区は「川西・中郷・宇根」「川東・苅米(根古屋の一部含む)」「根古屋・芦ヶ久保(苅米の一部含む)」の3区分。 各PDFはAdobe InDesign 21生成の2ページ、テキスト層あり(pdftotextで日付・ごみ種別が抽出可能、char~6600)。
  ただし複数月を横並びにした雑誌型グリッドレイアウトで、テキストの座標配置から日付と種別を対応付ける解析が必要なため難度3。 収集回数: 可燃週2/不燃月1/紙布月2/カンビン月2/ペットボトル月2。 年末年始はカレンダー内に明示(「新年の1日〜3日はごみ収集・持込ともお休み」、12月末〜1月初に「休」マーク)。
  ライセンス: サイトポリシーで無断複製・転載・改変を禁止(全権利留保、CC BY/政府標準利用規約の記載なし)。 埼玉県ODポータル(opendata.pref.saitama.lg.jp)に横瀬町ごみ収集の個別データセットは確認できず。CSV/JSON提供なし。
  curl 403 なし(3PDFとも HTTP 200 で取得可)。

  【実地解析 2026-08-03】令和8年度PDFは InDesign 雑誌デザインで、テキストは語にまとまらず(extract_words 空)、日付マスの背景色も rect でなく curves 描画のため、文字/座標ベースの抽出は非現実的。しかし品目がセル背景色で塗り分けられている(可燃=緑124,205,93 / 不燃=黄252,202,22 / 紙布=紫173,139,205 / カンビン=水色89,202,245 / ペット=茶195,143,81 / クリーンサンデー=ピンクは施設持込で除外)ことを利用し、文字も日付も一切読まない色ベース抽出の目処が立った(PoC成功)。手法: (1)各月グリッドは罫線の外枠(w345×h227、3列×2段/ページ、2ページで12ヶ月)で位置確定(秩父市PDFは各月枠に矩形を配置してもらった)。(2)暦で各日付→(週行,曜日列)を計算しセル座標を得る。(3)6週ある月は最終マスを上下2分割(第5週=上・第6週=下)。(4)セル領域を格子スキャンし品目色に一致するピクセルを集めて、斜め分割(右上↔左下)・上下2段の複数品目も網羅。可燃(月木)は全月・6週目(8/24+8/31)まで検証済み。残りはパターン導出(毛呂山手法)で品目確定→2ページ目と5市町展開。ごみアプリ「さんあ〜る」(第三者商用)は機械可読データ無しで一次に使えない点は変わらず。取得済PDFは tools/pdf-extractor/chichibu-koiki/cache/。

  【収録済 2026-08-03】3地区(course=44川西・中郷・宇根/45川東・苅米/46根古屋・芦ヶ久保、組合番号)を収録。秩父市で確立した色ベース抽出(tools/pdf-extractor/chichibu-koiki、四隅テンプレートをextract.pyに埋め込み)を流用。横瀬町PDFは秩父市と同一InDesignテンプレート(同一mediabox1108x1536・InDesign21・2ページ)で四隅座標がそのまま適用でき、矩形配置は不要だった。可燃=水・土(週2、年末年始1日休止のcancelled)、不燃月1、紙布/カンビン/ペット月2。実日付からweekly/monthly_specificを導出し規則の再展開が抽出と品目ごと完全一致することを自己検証。目視は44の4月をサンプル確認(画像と一致)。build は複数自治体対応(node build.mjs yokoze-town)。'
