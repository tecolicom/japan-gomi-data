handle: hanno
name_ja: 飯能市
region_ja: 埼玉県
code: "11209"
source:
  index_url: https://www.city.hanno.lg.jp/soshikikarasagasu/kankyokeizaibu/cleancenter/4/893.html
notes:
  # course-*.yaml は tools/pdf-extractor/hanno が生成する。直したいときは生成器を直して make regen する
  - コース別カレンダー PDF (2026*.pdf, InDesign 製) はテキスト層が無い。品目名も日番号もアウトライン図版なので、抽出は罫線から復元したグリッドとセルの塗り色だけで行う
  - 可燃とプラは weekly なので第5週も収集がある。それ以外の品目は月内の決まった回数だけで、第5週には収集がない
  - PDF の「休業」は年末年始のクリーンセンター休業 (12/29〜1/3 前後)。その日に通常収集がある場合は収集も休止する
  # 品目辞典とライセンス
  - 2026-08-20 品目辞典 bunbetsu-jiten.yaml (567品目) を hanno-data から移管。分別事典 PDF (P9-24) が出どころで、日程とは別の資料。収録期間ディレクトリには置かない (writeCourses が期間ディレクトリを消すため handle 直下に置く)
  - '辞典の category は 2 つの正典にまたがる。収集種別 (schema/categories.yaml) が 498品目、処分可否 (schema/disposal.yaml) が 69品目 — not_collected 45 / drop_off_only 9 / reference 15'
  - '**辞典はこのリポジトリの CC BY 4.0 の対象外。** 市は「飯能市ホームページについて」(shiseijoho/koho_johohasshin_hodohappyo/johohasshin/5027.html) で「諸権利は飯能市に帰属します」「無断で複製・転用することはできません」と定めており、政府標準利用規約も CC BY も採用していない'
  - 日程は事実なので著作権が及ばないという整理でこのリポジトリに収録しているが、辞典は 567品目の選択・配列と note の文言が市の著作物になりうるため扱いが違う。source.license は proprietary-municipality
  - '**未了: 市への確認。** 運営者が別途進める。**問い合わせフォーム等から正面で照会しない** — 一度断られると覆しにくく、かえって身動きが取れなくなるため。結果が出たら source.license を更新する'
  # 検証記録
  - 2026-08-14 全6コース×12か月を PDF 目視で全数照合 (150dpi 画像化)。A-1 に2件の誤りを発見し修正
  - 修正 1 A-1 ペットボトルを第1・3・5水曜 → 第1・3水曜へ。第5水曜 (4/29・7/29・9/30・3/31) はプラのみ
  - 修正 2 A-1 紙・布を第2・4・5火曜 → 第2・4火曜へ。第5火曜 (6/30・9/29・3/30) は収集なし
  - A-2/A-3/B-1/B-2/B-3 は年始振替も含めて PDF と完全一致 (不一致 0)
  - 2026-08-14 収録当初の生成器が失われていたため tools/pdf-extractor/hanno を起こし、course YAML を生成物に切り替えた (日程は 1 日も変えていない)
  - 切り替え時の照合は 6コース×365日=2190日枠で不一致 0。修正前のデータに対して回すとちょうど 7 日の差分が出るので、この検査が実際に効いていることも確認済み
  - 生成した規則 60 本と overrides 30 件は、手書き正典と完全に一致した。人が読み取った規則も例外も、ピクセルだけを見る抽出が独立に再導出したことになる
  - 休業日はコース別。12/29 (火) は A 系 3 コースが休業だが、火曜が可燃の B 系は収集している。年末年始の「休業」は赤字なので、赤い画素の量で拾って cancelled にしている (「休業」317〜347px と祝日の日番号 74〜89px は大きく離れている)
  - 休業日を cancelled として残すのは、そのコースで元々収集がない日も含めてのこと。日程は変わらないが、これが無いと利用者から見て年末年始に市が休むこと自体が読み取れない
  - 月内 n 回目からずれるのは 2027-01 だけ。1/1 (金) 休業で 1 週繰り下がる A-2 の資源枠と A-3 の不燃・紙布・びん枠に限られ、他の 4 コースは 12 か月とも暦どおり
