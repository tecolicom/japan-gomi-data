# 鳩山町の読み物断片 (facts)。事実と出典に基づく。文体: です・ます調、2〜4 文。
facts:
  - id: collection-on-holidays
    title: 祝日も休まずに収集する
    body: >-
      鳩山町では、祝日も通常どおりごみ・資源を収集します。祝日に収集を休んだり翌日へ振り替えたり
      する自治体が多いなか、鳩山町のカレンダーは祝日の日にもそのまま品目が入っています。休むのは
      年末年始だけです。
    scope: city
    tags: [収集日, 祝日]
    sources:
      - http://www.hozenkumiai.or.jp/pdf/hatoyama2026_a.pdf (令和8年度 ごみ・資源収集カレンダー)
  - id: kumiai-processing
    title: ごみ処理は1市3町の共同「組合」が担う
    body: >-
      鳩山町のごみ収集・処理は、町が単独で行うのではなく、鶴ヶ島市・毛呂山町・鳩山町・越生町の
      1市3町でつくる一部事務組合「埼玉西部環境保全組合」が担っています。新しいごみ焼却施設
      (埼玉西部クリーンセンター)も鳩山町内に置かれ、1市3町のごみを共同で処理しています。
    scope: city
    tags: [運営体制, 広域処理]
    sources:
      - http://www.hozenkumiai.or.jp/ (埼玉西部環境保全組合)
  - id: zairai-danchi-districts
    title: 「在来地区」と「団地地区」で収集日が分かれる
    body: >-
      鳩山町は町内を A・B の2地区に分けて収集します。A地区はおもに昔からの集落(大橋・熊井・今宿
      など)、B地区は松ヶ丘・楓ヶ丘・鳩ヶ丘といった鳩山ニュータウンの団地です。可燃ごみはどちらも
      火・金ですが、資源などの収集日は地区で異なるため、配布カレンダーの地図で自分の地区を確認します。
    scope: city
    tags: [地区, ニュータウン]
    sources:
      - http://www.hozenkumiai.or.jp/pdf/hatoyama2026_a.pdf (令和8年度 ごみ・資源収集カレンダー A/B地区)
