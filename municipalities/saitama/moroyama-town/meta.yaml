region_ja: 埼玉県
code: "11326"
source:
  index_url: https://www.town.moroyama.saitama.jp/soshikikarasagasu/seikatsukankyoka/kankyoukakari/gominowakekatadasikata/3203.html
  schedule_url: http://www.hozenkumiai.or.jp/pdf/moroyama2026_a.pdf
  yearend_url: http://www.hozenkumiai.or.jp/pdf/moroyama2026_a.pdf
notes:
  - "一次ソース: 毛呂山町のごみ処理を担う一部事務組合「埼玉西部環境保全組合」(hozenkumiai.or.jp)発行の令和8年度ごみ・資源収集カレンダーPDF 3枚(moroyama2026_a/b/c.pdf、A/B/C地区)。埋込CIDフォントのテキスト層があり、tools/pdf-extractor/moroyama-town/extract.py が pdfplumber で日付グリッド(1ページ12ヶ月・3列4段)の各日付セル直下の品目略称を座標抽出する。町公式サイトの同名PDFはベクター描画でテキスト層が無く不採用。"
  - "収録単位: 収集は A/B/C の3地区。地区ごとに全品目のパターンが異なるため 3 コース(course-a/b/c)。地区に含まれる町名・大字の対応表は町・組合とも公開しておらず(カレンダーPDF内の地図のみ)、住民は配布された自地区のカレンダーで判断する。このため areas は地区名のみ(町名・machiaza_id 無し)。"
  - "種別マッピング(taxonomy.yaml と一致、語彙追加なし): 可燃=burnable / 不燃=non_burnable / 他プラ(その他容器包装プラスチック)=plastic / びん缶(びん・かん類 同日)=glass_bottle+beverage_can / 有害=hazardous / 紙布(紙・布類 同日)=paper+cloth / ペット(ペットボトル)=pet_bottle。紙布は PDF 上「紙」「布」の2 word(同日隣接)で入るため extract は「紙」で代表し build で paper+cloth へ展開する。"
  - "パターン導出: カレンダーは日付入りだが、各品目の実収集日から曜日+第n パターンを導出して rules 化する(build.mjs)。例(A地区): 可燃=毎週 月・木(weekly) / 他プラ=毎週 火(weekly) / びん缶=第2・4 火 / 不燃・有害=第1・3 金 / 紙布=第1・3 水 / ペット=第2・4 金(monthly_nth)。B・C地区は曜日が異なる。"
  - "祝日と年末年始: 毛呂山町は祝日も通常どおり収集する(振替なし。5/4等の祝日にも可燃を確認)ためパターンで表現できる。例外は年末年始(12/29〜1/3頃)の休止のみで、パターン該当日が実カレンダーで休止する分を overrides に cancelled で記録した(A地区4件・B/C各3件)。"
  - "粗大ごみ: 別途申込・有料で集積所対象外 → rules 非対象。使用済乾電池・蛍光管等は「有害ごみ」の日に収集し hazardous に含める。"
  - "検証(2026-08-02): 導出したパターン rules で令和8年度(2026-04〜2027-03)の全収集日を再生成し、PDF 抽出の実日付と突合。パターンにあり実に無い日=年末年始休止(overrides 化)、実にあってパターンに無い日(振替・臨時・抽出誤り)=0件で、3地区とも実カレンダーを完全再現。日付レベルまで一致する強い自己検証(倉敷と同型)。座標抽出の綻び(隣接曜日への誤配置)は割当を x差優先にして解消済み。"
  - "ライセンス: 収集日程データ自体の公開ライセンスは未確認(町サイト利用規約は組合PDFを対象としない、埼玉県ODポータルにごみ収集日程データセット無し)→ unknown。収集日という事実データの抽出として収録(練馬・杉並・所沢と同じ整理)。全国系アプリ「さんあ〜る」は第三者商用のため一次ソースに採らない。"
