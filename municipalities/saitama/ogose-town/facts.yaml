# 越生町の読み物断片 (facts)。事実と出典に基づく。文体: です・ます調、2〜4 文。
facts:
  - id: collection-on-holidays
    title: 祝日も休まずに収集する
    body: >-
      越生町では、祝日も通常どおりごみ・資源を収集します。祝日に収集を休んだり翌日へ振り替えたり
      する自治体が多いなか、越生町のカレンダーは祝日の日にもそのまま品目が入っています。休むのは
      年末年始だけです。
    scope: city
    tags: [収集日, 祝日]
    sources:
      - http://www.hozenkumiai.or.jp/pdf/ogose2026_a.pdf (令和8年度 ごみ・資源収集カレンダー)
  - id: kumiai-processing
    title: ごみ処理は1市3町の共同「組合」が担う
    body: >-
      越生町のごみ収集・処理は、町が単独で行うのではなく、鶴ヶ島市・毛呂山町・鳩山町・越生町の
      1市3町でつくる一部事務組合「埼玉西部環境保全組合」が担っています。収集カレンダーも町ではなく
      組合が発行しています。近隣自治体と施設を共同運営することで、小さな町でもごみ処理を維持しています。
    scope: city
    tags: [運営体制, 広域処理]
    sources:
      - http://www.hozenkumiai.or.jp/ (埼玉西部環境保全組合)
  - id: two-districts
    title: 町内は A・B の2地区で収集日が違う
    body: >-
      越生町は町内を A・B の2つの地区に分け、地区ごとに収集する曜日が異なります。たとえば可燃ごみは
      A地区が月・木、B地区は火・金です。自分がどの地区かは、配布される地区別カレンダーと、そこに
      載っている地図で確認します。
    scope: city
    tags: [地区, 収集日]
    sources:
      - http://www.hozenkumiai.or.jp/pdf/ogose2026_a.pdf (令和8年度 ごみ・資源収集カレンダー A/B地区)
