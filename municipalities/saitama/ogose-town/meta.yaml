handle: ogose-town
name_ja: 越生町
region_ja: 埼玉県
code: "11327"
source:
  index_url: http://www.hozenkumiai.or.jp/
  schedule_url: http://www.hozenkumiai.or.jp/pdf/ogose2026_a.pdf
  yearend_url: http://www.hozenkumiai.or.jp/pdf/ogose2026_a.pdf
notes:
  - "一次ソース: 越生町のごみ処理を担う一部事務組合「埼玉西部環境保全組合」(hozenkumiai.or.jp)発行の令和8年度ごみ・資源収集カレンダーPDF 2枚(ogose2026_a/b.pdf、A/B地区)。埋込CIDフォントのテキスト層があり、共通ツール tools/pdf-extractor/saiseibu-kumiai/ が pdfplumber で日付グリッド(1ページ12ヶ月・3列4段)の各日付セル直下の品目略称を座標抽出する。"
  - "収録単位: 収集は A/B の2地区。地区ごとに全品目のパターンが異なるため 2 コース(course-a/b)。地区に含まれる町名・大字の対応表は町・組合とも公開しておらず(カレンダーPDF内の地図のみ)、住民は配布された自地区のカレンダーで判断する。このため areas は地区名のみ(町名・machiaza_id 無し)。"
  - "種別マッピング(taxonomy.yaml と一致、語彙追加なし): 可燃=burnable / 不燃=non_burnable / 他プラ(その他容器包装プラスチック)=plastic / びん缶(びん・かん類 同日)=glass_bottle+beverage_can / 有害=hazardous / 紙布(紙・布類 同日)=paper+cloth / ペット(ペットボトル)=pet_bottle。紙布は PDF 上「紙」「布」の2 word で入るため extract は「紙」で代表し build で paper+cloth へ展開する。"
  - "パターン導出: カレンダーは日付入りだが、各品目の実収集日から曜日+第n パターンを導出して rules 化する(build.mjs)。可燃は A地区が毎週 月・木、B地区が毎週 火・金(weekly)。他プラは毎週(weekly)、びん缶・不燃有害・紙布・ペットは第n(monthly_nth)で、地区ごとに曜日が異なる。"
  - "祝日と年末年始: 越生町は祝日も通常どおり収集する(振替なし)ためパターンで表現できる。休止は年末年始と、B地区の8月24日(他プラ・びん缶)。パターン該当日が実カレンダーで休止する分を overrides に cancelled で記録した(8/24はカレンダーに理由の記載が無いが実PDFに該当品目が無く休止。records は PDF グリッド品目を漏れ・重複なく写しており未割当0のため、この休止は実ソース由来と確認できる)。"
  - "粗大ごみ: 別途申込・有料で集積所対象外 → rules 非対象。使用済乾電池・蛍光管等は「有害ごみ」の日に収集し hazardous に含める。"
  - "検証(2026-08-03): 導出したパターン rules で令和8年度(2026-04〜2027-03)の全収集日を再生成し、PDF 抽出の実日付と突合。実にあってパターンに無い日(振替・臨時・抽出誤り)=0件で、2地区とも実カレンダーを完全再現(倉敷・毛呂山と同型の日付レベル自己検証)。逸脱は年末年始休止のみ。"
  - "ライセンス: 収集日程データ自体の公開ライセンスは未確認(埼玉県ODポータルにごみ収集日程データセット無し)→ unknown。収集日という事実データの抽出として収録(練馬・杉並・所沢と同じ整理)。全国系アプリ「さんあ〜る」は第三者商用のため一次ソースに採らない。"
