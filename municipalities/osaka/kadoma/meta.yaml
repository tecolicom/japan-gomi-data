notes:
  # course-*.yaml は tools/html-extractor/kadoma が生成する。直したいときは生成器を直して make regen する
  - "一次ソース: 市公式「地区別ごみカレンダー」ページ (HTML、更新日 2026-03-30)。地区ごとの町名と、品目ごとの収集曜日の表を規則にした。収録期間 2026-04--2027-03 は地区別カレンダー PDF の見出し「令和8年4月1日～令和9年3月31日」による (HTML には期間の記載が無い)"
  - "1 地区 = 1 course (course 値は地区名 A〜F)。ごみは収集日の朝9時までに出す"
  - "粗大ごみ (要予約・有料。電話で申し込み、処理券を貼る) は収録していない。ただし曜日は HTML とカレンダーの両方にあり、照合には使った"
  # 品目
  - "品目は市の区分名にあるものだけを割り当てた: 普通ごみ=burnable / プラスチック製容器包装=plastic / びん・缶類=glass_bottle+beverage_can / 古紙古布=paper_cloth / 小型ごみ=non_burnable / ペットボトル=pet_bottle"
  - "分け方のページ (kurashi/gomi/9/4394.html) によると、「びん・缶類」の日にはスプレー缶・簡易ガスボンベも出す (中身を使い切り、袋を分けて「キケン」と張り紙)。「小型ごみ」の日は 30cm 以下の金物類・陶磁器類・ガラス類・小枝・蛍光管・電池・ライターと一斗缶。spray_can・hazardous は区分名に無いので付けていない (区分の中身をどこまで語彙に分けるかは今後の課題)"
  # 年末年始・祝日
  - "年末年始: 6 地区の PDF カレンダーとも 12/30・12/31・1/1 が空欄。収集予定のある 12/31 (A〜D) と 1/1 (全地区) を cancelled にした (12/30 は第5水曜で、もともと収集が無い)。PDF には「【年末年始について】収集日を変更する場合があります。あらかじめ市広報・ホームページでお知らせします」とあるので、12 月に市の告知を確かめる"
  - "祝日も通常どおり収集する (カレンダーの 5/4〜5/6 などにも品目がある)"
  # areas
  - "areas は HTML の町名の列挙をそのまま使う。「岸和田1丁目～4丁目」は 1 丁目ずつに分けた。北巣本町は番地で B 地区 (1番～34番) と C 地区 (35番～38番) に分かれるので「北巣本町（1番～34番）」「北巣本町（35番～38番）」の 2 つの area にした (同じ町字 ID を持つ)"
  - "yomi と machiaza_id は ABR 町字マスター (大阪府版、lg_code 272230、91 町字) と名前が一致したときだけ付けた。丁目は町字名 + 丁目番号で引く。打越・野口・横地・北島は ABR では「大字打越」などの大字なので「大字」+ 名前で引き、読みの先頭の「おおあざ」を外した。打越町・北島町は別の町で D 地区"
  - "E 地区 (市営門真下馬伏住宅・市営門真四宮住宅・市営門真北岸和田住宅・南門真ハイライフ) と F 地区 (市営門真三ツ島住宅) は町名でなく建物の単位。ABR に無いので読みも町字 ID も無い。これらの建物がある町は C・D 地区などの area と重なるが、どの町にあるかは一次ソースに無いので、町の area には注記していない。名前から決めない (市営門真四宮住宅は北岸和田2丁目にあるとする民間サイトの記載があり、名前と所在地が一致しないことがある)"
  - "ABR の町字のうち、大字門真・大字桑才・大字三番・大字薭島・大字三ツ島官有・大字薭島官有の 6 つはどの地区にも出てこない。build はこの 6 つ以外の取り残しが出たら止まる"
  # 検証記録
  - "2026-10-22 照合: 規則は HTML の表の文から作り、地区別 PDF カレンダー (日付入り) と全 365 日を突き合わせた。PDF は文字がアウトライン化されているので、月の枠を罫線から、マスの日付を暦から決め、アイコンの下の品目名の色で品目を読む (日付のあるマスにだけ日番号の図形があることも確かめる)。6 地区 × 365 日 = 2,190 日枠で、食い違いは年末年始の空欄 10 日枠だけ → それ以外は不一致 0 で 95% 信頼 <0.14%/日枠。HTML の規則行 42 行 (粗大ごみを含む) で不一致 0 → <7.1%/行 (rule of three)。PDF は HTML とは別に組版された資料"
  - "照合が効くことは改竄で確かめた (tools/html-extractor/kadoma/README.md に一覧): 生成物で休止を外す・曜日を変える・回数を足す・休止を足す → verify が差分を出す。一次ソース側で PDF の品目名を 1 つ消す・1 つ足す・2 ページを入れ替える、HTML の回数を書き換える・町名を別の地区と重複させる → build が止まる"
