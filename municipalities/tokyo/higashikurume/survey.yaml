notes: '収集日程はHTMLページ 1000817.html(HTTP200, <table>0個, テキスト/リスト形式)とテキスト層付きPDF gomi_karennda.pdf(HTTP200, application/pdf, 351606B, pdftotext82行, 日付なし恒久カレンダー)で提供。 2地区制=東地域(氷川台/金山町/上の原/神宝町/大門町/東本町/新川町/浅間町/本町/学園町/ひばりが丘団地/南沢/中央町
  の13町丁)・ 西地域(小山/幸町/野火止/八幡町/下里/南町/前沢/弥生/滝山/柳窪 の10町丁)。 曜日ルール例: 東地域=月:容器包装プラ・PET/火:燃やせるごみ・びん/水:燃やせないごみ・有害/木:缶・紙・布/金:燃やせるごみ・びん。 西地域=月火が入替+金:缶・紙・布。収集曜日のCSV/JSONは不在(OD配布ドメインにあるCSVは 132225_higashikurumeshi_garbage_separate.csv=品目別分別辞典1109行UTF-8BOM、schedule系名8パターン試行全404)。
  年末年始は祝日ページ1024838.htmlで「決まり次第掲載」=随時告知。HTMLに<table>が無いためPDFのテキスト層の方が 地区↔町丁↔曜日の対応が取りやすい(source_typeはpdfも実用候補)。catalog.data.metro.tokyo.lg.jpはWebSearch経由でのみ到達(CLI 403想定)。 ライセンス: 分別CSVはCC-BY-4.0だが収集日程ページ/PDF自体のライセンス明記は未確認。
  【統括正規化】license: CC-BY は市OD分別CSVのもので収集日程ソース自体は unknown。 【実地調査 2026-08-19 / 見送り】曜日規則そのものは機械可読で難しくない。収集曜日ページ 1000817.html の本文に「東地区（上の原…中央町 の13町丁）」「西地区（小山…弥生 の10町丁）」と町名つきで並び、続けて「月曜日：容器包装プラスチック・PETボトル」形式の行が5曜日ぶん出る
  (table は 0 個、箇条書き)。照合用の gomi_karennda.pdf (Excel 2010 製・A4 1ページ) も同じ曜日×品目×地域の表で、HTML と独立な第2表現になる。品目は 燃やせる/燃やせない/容器包装プラ/PETボトル/びん/缶/紙類/布類/有害 の9種で正典語彙に収まる (紙類・布類は paper+cloth に分解)。 ★見送りの理由: **収録期間を裏付けるものが無い**。曜日規則の
  HTML も PDF も日付を一切持たない恒久カレンダーで、年度の記載もない。祝日の扱いは別ページ 1024838.html にあるが (「以下の祝日及び振替休日は、平日と同様に収集」)、掲載は令和8年4月29日〜9月23日までで「上記以降の祝休日につきましては、決まり次第掲載します」と明記されている (更新日 令和8年4月2日)。年末年始の休止日は未公表。したがって一次ソースが裏付けるのは 2026-04〜2026-09
  の半年だけで、通年を収録すると「この範囲の外は展開しない」の不変条件に反する。 → 再開の条件: (1) 1024838.html に令和8年10月以降の祝休日が掲載される、(2) 年末年始の休止日が告知される (例年12月)。どちらも満たせば 2026-04--2027-03 で収録できる。監視は収録済み自治体が対象のため check-new-editions では拾われない — 人が見に行く必要がある。'
