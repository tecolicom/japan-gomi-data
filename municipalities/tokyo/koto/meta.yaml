notes:
  - "区の 4 区分と正典語彙の対応: 「資源」(週1回) → paper + glass_bottle + beverage_can + pet_bottle、「プラスチック」(週1回・**資源とは別の日**) → plastic、「燃やすごみ」(週2回) → burnable、「燃やさないごみ」(隔週) → non_burnable。資源の内訳は区「資源の出し方」(kate/sigen.html) による — 古紙(新聞・雑誌雑がみ・ダンボール)、びん、かん、ペットボトル、発泡トレイ・発泡スチロール。"
  - "**「発泡トレイ・発泡スチロール」は正典語彙が無く、ペットボトルを代表項目として表現した** (語彙追加なし)。材質としてはプラスチックだが、江東区では**プラスチックが資源とは別の日**なので plastic に寄せると誤った日を教えることになる。資源の日に乗る 4 品目のうちプラスチック製はペットボトルだけなので、そこへ相乗りさせた。ラベルには列挙していない — 品目→種別の辞書はこのリポジトリの収録範囲外 (README) で、代表項目があれば住民は引ける。荒川区は同じ品目を pet_bottle のラベル override (「ペットボトル・食品用トレイ」) で扱っているが、あちらは区の CSV 列見出しが「ペットボトル・発泡スチロール製食品用トレイ」で**ラベルが区の命名を写していた**のに対し、江東区にはその複合名が無い。なお全国の調査台帳 127 件を見ても、発泡トレイが単独の収集日を持つ自治体は 1 件も無い (檜原村も「缶・びん/ペットボトル/白色トレイ」で 1 タイル)。**次の版ではこの対応が動きうる** — 台東区は令和7年3月末に食品発泡トレイを資源からプラスチックへ移した。"
  - 古着・古布は区の資源に含まれず対象外。粗大ごみは申込制 (粗大ごみ受付センター) のため対象外。
  - "**都カタログの CSV は地区割の正典ではない。** 現行版シート (令和8年度版) と 2 町で食い違う。豊洲: CSV は全域 → 地区6、シートは 2・4〜6丁目 → 地区6 / **1・3丁目 → 地区12**。塩浜: CSV は 1丁目 → 地区6 / 2丁目 → 地区12、シートは**全域 → 地区12**。逆方向の食い違いが 2 件。CKAN の last_modified は 2024-11-30 でシートは令和8年度版 (ページ更新 2026-04-10)、地理的にも塩浜1丁目を青海・有明 (湾を挟んだ埋立地) と同じ地区にする CSV 側が不自然なため、**シートを採った** (2026-09-12 に上流承認)。CSV は「修正」せず、食い違いをここに記録する。中野区の OD が 2021 年止まりだったのと同型で、playbook の「カタログ OD は鮮度に注意」に当たる。build は置換対象の 3 行が CSV に存在することを毎回確認し、消えていれば止まる。"
  - "**燃やさないごみは隔週で、weekly でも monthly_nth でも表せない** (月内 n 回目が月をまたいでずれる) ため monthly_specific (実日付列挙) にした。日付は配布シートが 12 か月ぶん印字している。"
  - "**年末年始は unknown_periods に置いた (cancelled ではない)。** 窓 2026-12-29〜2027-01-03 は選んだものではなく**データから出た** — 隔週の日付がこの窓に当たる地区は、その日だけが印字されていない (地区2=12/29 / 地区3=12/30 / 地区4=12/31 / 地区5=1/1 / 地区6=1/2)。窓の外の月曜 12/28・1/4 は印字されている。1/3 は日曜で元々収集が無いが振替告知の可能性があるので窓に含めた。シートが「※年末年始の収集日については、別途お知らせします。」と確定を留保しているため断定しない。**なお実日付を持つのは燃やさないごみだけで、週次3品目にこの窓を適用する根拠はこの注記である** (週次は曜日表記しか無い)。12 月に告知が出たら overrides へ落とすこと。"
  - "祝日は通常収集する。ただし**根拠が非対称**で、燃やさないごみのグリッドは祝日 (2026-05-04 みどりの日・09-21 敬老の日・11-03 文化の日など) を赤字で**収集日として印字**しているのに対し、資源・プラスチック・燃やすごみは曜日表記のみで明文の記述は区サイト・PDF のどこにも無い。"
  - "検証 (2026-09-12): 3 系統。①**版どうしの照合** — 中国語版と韓国語版は同じ表を別々に組版してあるので同じパーサで読んで突合。12 地区の曜日規則・隔週の曜日・隔週の全日付 344 項目で不一致 0。②**日本語版との照合** — 日本語版 (8omote.pdf) は chars 0 の画像 PDF で機械では読めないため 400dpi で画像化して目視転記し、生成物と突合。12 地区 × 4 品目 = 48 セル + 12月・1月の隔週日付 48 件で不一致 0 (**年末年始の端を狙った** — 12 地区中 5 地区がこの 2 か月で 1 回抜けるので、抜けの有無がそのまま検査になる)。転記は verify.mjs の JA_SHEET に固定保持。③**展開との突合** — 生成物を収録期間の全日に展開し、シートから読んだ実日付と 4,308 日枠で突合、不一致 0。加えて build が毎回、都カタログ CSV との曜日規則照合 (55 行 × 4 品目) と ABR 町字 158 件の網羅、隔週の 14 日刻みを検査する。改竄 5 通りで各検査が落ちることを確認済み。**うち 1 通りは当初空振りした** — 検査 C が生成物の出した収集日だけを回しており、生成物から日付を消すとループが訪れず不一致にならなかった。収録期間の全日を回す形に直した。"
  - "確率的信頼度: 独立照合の N は**日本語版との 48 セル + 48 日付 = 96 項目** (目視転記なので 1 つの読み違いで壊れる最小単位)。ゼロ不一致から rule of three で **95% 信頼で誤り率 p < 3.1%/項目**。CSV との曜日規則照合は別に N=220 セル (55 行 × 4) で p < 1.4%/セル。等級は①(独立ソースとの日付レベル照合) だが、**日付レベルで独立照合できたのは 12 月・1 月の 48 日付に限られる** — 残り 10 か月は版どうしの照合 (中国語版↔韓国語版) しか当たっておらず、これは同じリーフレット群なので独立性が弱い。**残余リスクは共通原因誤り**と、目視転記していない月の版面誤り。町字の網羅検査だけが区の刊行物外 (ABR) と突き合わせている。"
