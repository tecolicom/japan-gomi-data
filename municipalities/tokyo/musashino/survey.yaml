notes: '令和8年度(2026.4〜2027.3)版。市内10地区 (A吉祥寺南町/B吉祥寺本町2-4・御殿山/C吉祥寺本町1・吉祥寺東町/ D吉祥寺北町/E中町/F緑町・八幡町/G西久保/H関前・桜堤/I境/J境南町)。
  各地区に3種のPDF: 収集カレンダー(2026x-1.pdf, 4.3-4.5MB, 通年日付入り) / 収集日一覧表(2026x-2.pdf, 約750KB) / 集合住宅用一覧表(sticker2026x.pdf)。★実測
  (2026-07-18): 一覧表2026a-2.pdf はテキスト層あり(4627字)。 ただし多言語(和英中)併記でレイアウトが横長・品目ヘッダと曜日値が散在=素直なテキスト版ではなく要パース → difficulty
  3。 品目= 燃やすごみ/古紙・古着/びん・缶/危険・有害/ペットボトル/燃やさないごみ/プラスチック製容器包装。 granularity: 一覧表は weekday-rules だがカレンダーPDF(2026x-1)は日付入り通年=dates級
  (未テキスト層確認, 一覧表と同系ならテキスト層あり見込み)。 収集曜日オープンデータ・CSV/JSONは無し (ページに参照なし)。年末年始はページ本文に記載なし=要カレンダーPDF確認。 市サイトはCC宣言なし=事実データ抽出整理(proprietary-site)。
  【収録済 2026-08-10】10地区(course=A〜J)を収録期間 2026-04--2027-03 で収録(tools/pdf-extractor/musashino)。granularity は dates へ、yearend は calendar-explicit へ訂正。
  一覧表(2026x-2.pdf)ではなく**カレンダーPDF(2026x-1.pdf)**を一次にした。⚠CとEのみファイル名が 2026{c,e}-1-1.pdf。
  このPDFはIllustrator製で本物の罫線ベクタを持つため、色ベース抽出(秩父広域)不要。長い水平/垂直罫線からブロック矩形と7列を復元し、
  「同じ列で自分より上にある直近の日番号」に品目を帰属させる方式で全10地区×365日を取得。1ページ目は表紙(前年度ミニ暦)で除外。
  罠: 太字の文字二重打ち(燃燃ややすす→燃やす)、ページ番号8ptと日番号12.8/21.0ptの分離、6週ある月(2026年8月・5月)の週末セル縦積み、
  ⚠**列は語の中心で判定する**(左端だと中央寄せの添え書き「(年末特別収集)」が隣列にはみ出し1日ずれる — 実際に踏んだ)。
  ペットボトルは6月まで隔週・7月から毎週(市サイトとPDF表紙に明記)→ monthly_specific。燃やさないごみ・びん缶危険有害も隔週で monthly_specific。
  独立照合: 市サイト本文の地区別曜日サマリ(10地区×5曜日=50枠)を機械パースして突合、相違ゼロ。加えてPDFページ画像の目視転記6ヶ月130日枠と照合、相違ゼロ。
  年末年始は地区で異なる(A〜E: 12/29〜1/1、F〜J: 12/30〜1/1)。祝日・振替休日は通常どおり収集。粗大ごみは予約制でrules対象外。
  areas は 13町51丁目を1丁目=1areaで展開、yomi/machiaza_id は ABR 町字マスター(pref13, lg_code 132039)由来。10地区が51町字を重複・欠落なく分割することをbuildで機械確認。
  schedule_url は年度版の案内ページなので npm run check:editions の公開検知が効く(令和9年度版は例年3月に全戸配布・ページ新設)。'
