notes: >-
  主ソースは令和8年度版「青梅市のごみと資源物の分け方・出し方」PDF(A-H日程)。schedule_url=soshiki/23/1182.html は HTTP 200。 A日程PDF (uploaded/attachment/77610.pdf)
  は HTTP 200 application/pdf 6,892,849 bytes、pdftotext でテキスト層あり(約92,585文字)。 ただし抽出できるのは分別ルール解説と「収集は週2回(毎週)」「容器包装プラ=週1回・第3週除く」等の頻度テキストのみで、
  地区別の具体的収集曜日/日付は月間カレンダーの画像グリッド内にあり pdftotext では取得不可 (検出した「月曜/金曜/日曜」トークンは全て窓口/電話受付時間の記載)。よって granularity=partial(頻度ルールはテキスト、確定曜日は画像)。
  東京都ODカタログ t132055 には分別方法一覧(t132055d0000000010)・ゴミ集積所一覧(t132055d0000000037)・リサイクルセンター一覧等があるが、 収集日程/収集曜日のCSV/JSONは存在せず(WebSearchで確認)。市オープンデータページ(soshiki/80/2094.html)にも収集日データ無し。
  実装は画像OCRか第三者サイト照合が必要 → difficulty 4。各 A-H PDF がどの町丁目かの対応表は 1182.html 本文の町名列挙(約42町)から要抽出。
  【収録済 2026-08-10】★上の difficulty 4 / granularity partial は誤り。8日程(course=A〜H)を収録期間 2026-04--2027-03 で収録(tools/pdf-extractor/ome)。
  カレンダーは画像ではなく**罫線が本物のベクタ線**で、20〜25ページの月グリッドを座標復元できる。品目名だけがアウトライン化された図版なので、
  秩父広域と同じ**色ベース抽出**(袋アイコン3色 + 角丸ラベル9色)で判定した。文字も日付も読まない。→ difficulty 2 / granularity dates / license proprietary-site へ訂正。
  日付はグリッド位置(その月1日直前の日曜を起点に 行×7+列)から計算し、印字された日番号と一致することを検査。6週ある月は1セルに2つ縦積み。
  ⚠罠: (1)カレンダーページの判定は曜日ヘッダSUN..SATが2ブロック分あること(罫線数だけだと分別一覧ページを拾う)。(2)列幅が不均等で資源物の列だけ極端に広い。
  (3)雑誌・雑紙とダンボールは1行組(68×20、A/D/H日程)と3行組(43×44、B/C/E/F/G日程)で塗り色が微妙に違う。(4)未知色は無視されるので配色変更で静かに壊れる→次年度は品目別件数を必ず確認。
  ⚠市サイトは同一内容のPDFを町ごとに別attachment IDで貼っている(A日程だけで13 ID)。代表1本を取得し、別IDとのbyte同一性をsha256で確認済み。
  語彙: 「ガラス」(びん以外のガラス製品)はカンと、「陶磁器」はビンと常に同日収集で正典語彙が無いため未収録(日程情報の欠落ゼロ、鯖江・西東京の同型)。
  新聞・折込チラシ/雑誌・雑紙/ダンボール・飲料用紙パックはいずれも古紙で同一曜日の月内1・2・3回目に分かれるだけなので paper に統合(内訳は rule の note)。
  資源物はすべて monthly_specific。規則は「月内n回目のその曜日」だが年末年始の休止でひと月ぶん周期がずれる日程があり monthly_nth では表せない。
  独立照合: 冊子本文(7・10〜14ページ)の頻度規則を機械パースして突合(8日程×13枠=104枠)、相違ゼロ。PDFページ画像の目視転記(A・B日程の2026年4・5月、86日枠)も相違ゼロ。
  areas は 44町149町字(ABR pref13 lg_code 132055)を1丁目=1areaで展開。8日程が149町字を重複・欠落なく分割することをbuildで機械確認。
  schedule_url は年度版の案内ページなので npm run check:editions の公開検知が効く(令和9年度版は例年2月上旬〜3月上旬に全戸配布)。
