handle: toshima
name_ja: 豊島区
region_ja: 東京都
code: "13116"
source:
  # 区公式のごみ案内窓口 (「資源回収・ごみ収集カレンダー」)
  index_url: https://www.city.toshima.lg.jp/150/kurashi/gomi/shigen/2303021832.html
  # 一次ソース: 外国語版リーフレット「資源回収・ごみ収集のお知らせ」と「曜日一覧」の 2 ページ目。
  # 町丁名も曜日も**日本語のまま**印字され、その右に英語・中国語・韓国語の訳が並ぶ。
  # 掲載ページ: https://www.city.toshima.lg.jp/gomi-fl/foreignlanguage.html
  schedule_url: https://www.city.toshima.lg.jp/documents/27707/20260716110355.pdf
  # 年末年始の休止日は毎年 12 月頃にここへ掲載される。収録期間を延ばすときはここを見る
  yearend_url: https://www.city.toshima.lg.jp/150/kurashi/gomi/shigen/2211020850.html
notes:
  - "区の 4 区分と正典語彙の対応: 「びん・かん・ペットボトル類」→ glass_bottle + beverage_can + pet_bottle (同日)、「段ボール・紙布類 / プラスチック」→ paper_cloth + plastic (同日)、「燃やすごみ」→ burnable、「金属・陶器・ガラスごみ」→ non_burnable (中野区「陶器・ガラス・金属ごみ」と同じ整理)。同日収集は days 配列の共有 (YAML anchor) で明示している。語彙の追加は不要だった。"
  - "**祝日も通常収集する。** 一次ソースの欄外に「※雨の日や祝日(年末年始を除く)も資源やごみを収集します。また荒天時は、資源やごみの収集が遅れる場合や、中止することがあります。」と恒常ルールとして明記されている。したがって祝日一覧は不要で、収録期間内に休止日は無い (overrides は空)。"
  - "**「第n」は「その月 n 回目に来る曜日」であって第n週ではない。** 一次ソースの保存版が参考カレンダーつきで「第1・3の収集日とは、その月の1番目、3番目に来る曜日です」「第5(赤色表示)の収集はありません」「※第1週、第2週という数え方ではありません」と自ら定義している。リポジトリ規約と一致するので、飯能で起きた第5週の読み違いは構造的に発生しない。"
  - "**収録期間 2026-04--2026-11 の根拠。** 一次ソースは曜日規則だけで日付を持たない。祝日は上記のとおり恒常ルールで通常収集なので、東久留米で撤退の決め手になった「祝日の公表が半年ぶんしかない」問題はここでは起きない。期間の上限を決めているのは年末年始だけで、yearend_url は 2026-08-31 時点で令和7年度版 (2025-12-31〜2026-01-04 休止) のままであり 2026→2027 の休止日は未公表。鯖江の実例が示すとおり年末の最終収集日は 12 月下旬のどこにでも来るため、**12 月はソースが裏付けない**と判断して 11 月で切った。**12 月の告知が出たら期間を延ばすこと** (毎年 12 月に yearend_url を確認する)。"
  - "**池袋駅周辺繁華街地域は排出時刻が朝 7 時 30 分まで** (区内のその他は朝 8 時まで)。一次ソースは通常地域の表 (43 行) と繁華街地域の表 (15 行) を分けて掲げている。時刻の違いは現行スキーマで表せないため、繁華街地域の area には note に「池袋駅周辺繁華街地域」とだけ入れ、時刻はここに記録する。日程そのものが同じなら通常地域の area と同じコースに畳まれる。"
  - 粗大ごみは申込制 (豊島区粗大ごみ受付センター) なので日程データの対象外。家電リサイクル法対象品目も同様。
  - "**一次ソースの誤記を 1 件そのまま収録している。** 繁華街地域の池袋2丁目の行は、リーフレット (簡易版) では「…15番1号、6号18番、19番（要町通り沿い）」と 6号 と 18番 の間の読点が落ちている。保存版冊子の同じ行は「…15番1号・6号，18番，19番（要町通り沿い）」で、タイ語版・ヒンディー語版の訳も 15-1 / 15-6 / 18 / 19 と 4 つに分けて読んでいる (ベトナム語版だけ「2-6-18」と誤読している)。**ソースは修正せず**、一次ソースの表記のまま area 名にした。build.mjs の番地検査が「番地として読めない断片」として毎回この 1 件を報告する。"
  - "**survey.yaml (2026-07-18) の判定は誤りだった。** サーベイは source_type を app-only、difficulty 4 とし、多言語版リーフレットを「分別ルール解説主体で町名別曜日表は含まず=照合力弱い」と書いていたが、実際には 2 ページ目が曜日表そのものである (字数も「約17.4万字」とあるが実測 4.8 万字)。第三者アプリ「さんあ〜る」に頼る必要は無かった。青梅・三鷹・国分寺と同じ「見た目や文字数で判断して中身を確かめていない」型の誤り。"
  - 第三者商用アプリ「さんあ〜る」(delight-system) は一次ソースにも照合ソースにも使っていない (リポジトリ方針 2026-07-18)。
  - "検証 (2026-08-31): 3 系統。①**版どうしの照合** — 同じ表を別々に組版した外国語版 5 種 (ベトナム/ミャンマー/ネパール/タイ/ヒンディー) を同じパーサで読み、58 行 × 4 列を一次ソース (英中韓版) と全数比較 → 5 版 × 58 行 = 290 行で不一致 0。②**内部照合** — 一次ソースの日本語セルと英語セル (\"Tue.\" / \"1st and 3rd Fridays\") は別々に組まれているので突き合わせ → 232 セルで不一致 0。③**保存版冊子との全数照合** — 保存版 p34-35「資源回収・ごみ収集曜日一覧(50音順)」(documents/1053/20260403165803.pdf) は pdfplumber で chars 0 の完全な画像 PDF で機械では読めないため、600dpi で画像化して 58 行 × 4 列を目視転記し、生成した course YAML を収録期間の全日に展開して照合 → 102 area × 244 日 = 24,888 日枠で不一致 0。転記は verify.mjs の BOOKLET_ROWS に固定保持している。加えて build.mjs が、表の丁目が ABR 町字マスターの 83 件をちょうど過不足なく覆うことと、同一丁目を分け合う行の番地が限定なしで重ならないことを毎回検査する。"
  - "確率的信頼度: 独立照合の N は**保存版との 58 行 × 4 列 = 232 セル** (1 つの転記・抽出ミスで壊れる最小単位)。ゼロ不一致から rule of three で **95% 信頼で誤り率 p < 1.3%/セル** (行単位なら N=58 で p < 5.2%/行)。等級は①(独立ソースとの日付レベル全数照合) — 保存版冊子は簡易版リーフレットとは別の刊行物・別の版面で、日付レベルかつ収録期間の全数で照合した。版どうしの照合 (①の系統) と内部照合 (②) は同一リーフレット群なので独立性は弱く、版面の読み違いは検出できるが上流の原簿誤りは検出できない。**残余リスクは共通原因誤り** (区の原簿自体が誤っている場合) で、これは照合を重ねても消えない。丁目の網羅検査だけは ABR という区の刊行物外のソースと突き合わせている。"
