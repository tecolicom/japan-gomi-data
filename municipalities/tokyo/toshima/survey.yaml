notes: '【収録済 2026-08-31】収録した。一次ソースは**外国語版リーフレット「資源回収・ごみ収集のお知らせ」と「曜日一覧」の 2 ページ目** (documents/27707/20260716110355.pdf)。町丁名も曜日も日本語のまま印字され、その右に各言語の訳が並ぶ。通常地域
  43 行 + 池袋駅周辺繁華街地域 15 行 = 58 行、4 列 (びん・かん・ペットボトル類 / 段ボール・紙布類+プラスチック / 燃やすごみ / 金属・陶器・ガラスごみ)。22 コース・102 area。抽出は tools/pdf-extractor/toshima/。

  【2026-07-18 のサーベイは誤りだった】当初は source_type: app-only / difficulty 4 とし、多言語版パンフレットを「分別ルール解説主体で町名別曜日表は含まず=照合力弱い」と書いていたが、実際には
  2 ページ目が曜日表そのものである。字数も「約17.4万字」としていたが実測 4.8 万字。第三者アプリ「さんあ〜る」に頼る必要は無かった。青梅・三鷹・国分寺と同じ「見た目や文字数で判断して中身を確かめていない」型の誤り。→
  source_type: pdf-text / difficulty 2 / granularity weekday / district_count 58 へ訂正。

  【照合】外国語版は 6 言語 (英中韓 / ベトナム / ミャンマー / ネパール / タイ / ヒンディー) あり、同じ表を別々に組版してある。これを版どうしの照合に使える (5 版 × 58 行)。加えて保存版冊子
  p34-35 の曜日一覧 (documents/1053/20260403165803.pdf) は pdfplumber で chars 0 の完全な画像 PDF だが、A3 一枚に全 58 行が収まっており目視で全数転記できる (別の刊行物なので独立性が強い)。

  【運用ルール】祝日も通常収集 (一次ソース欄外に「※雨の日や祝日(年末年始を除く)も資源やごみを収集します」と明記)。休止は年末年始のみで、実日付は毎年 12 月に区が別途告知する (december-announce)。池袋駅周辺繁華街地域は排出が朝7時30分まで
  (他は朝8時まで)。粗大ごみは申込制のため対象外。

  【収録期間】2026-04--2026-11。曜日規則しか無いソースなので期間の上限は年末年始の公表状況で決まる。2026-08-31 時点で年末年始ページは令和7年度版のままなので 12 月は裏付けが無く、11
  月で切った。**12 月の告知が出たら期間を延ばすこと。**

