handle: chuo
name_ja: 中央区
region_ja: 東京都
code: "13102"
source:
  # 区公式のごみ案内窓口
  index_url: https://www.city.chuo.lg.jp/kurashi/gomi/calendar/index.html
  # 一次ソース: 「あなたの町のごみ・資源収集曜日」HTML 表 (3 地域・56 行)
  schedule_url: https://www.city.chuo.lg.jp/a0039/kurashi/gomi/calendar/syuusyuuyoubi.html
  # 年末年始の告知はまだ存在しない (2026-09-15 時点)。毎年 12 月頃にここから辿る
  yearend_url: https://www.city.chuo.lg.jp/kurashi/gomi/index.html
notes:
  - "区の区分と正典語彙の対応: 「燃やすごみ」→ burnable、「燃やさないごみ」→ non_burnable、「プラマーク」(プラスチック製容器包装。平成21年4月から専用の日を設けて回収) → plastic、「資源」→ paper + glass_bottle + beverage_can + pet_bottle + **metal**。資源の内訳は区「資源の分け方・出し方」による — 古紙(新聞・雑誌・雑紙・段ボール)、ペットボトル、びん・缶・**金属製のなべ・やかん・フライパン**。なべ類があるので metal を使う。語彙の追加は不要だった。"
  - "**粗大ごみは収録しない。** 区の表には町丁ごとの粗大ごみ曜日が載っているが、申込制 (粗大ごみ受付センターへインターネットまたは電話で申込) なので日程データの対象外 (リポジトリの慣行)。ただし**照合には使っている** — パンフレットにも同じ列があるので、無料で得られる 5 列目として 56 行ぶん突き合わせた。"
  - "**コースは規則で畳んでいる (13 コース)。** 粗大ごみを含めれば 26 通りあり、「4 品目は同じで粗大だけ違う」行が 6 組ある。粗大を収録しない以上それらは同じ日程なので畳むのが正しい。中央区は区が地区番号を定義していないため、板橋のように区の地区単位で振る必要はない (練馬・豊島と同型)。"
  - "**区のページは日本橋地域の町名から「日本橋」を省いている。** 表の「蛎殻町」は正式には「日本橋蛎殻町」で、ABR にも住民の住所表記にもそちらが使われる。19 町 33 行が該当する (大伝馬町・蛎殻町・兜町・茅場町・小網町・小伝馬町・小舟町・富沢町・中洲・人形町・馬喰町・箱崎町・浜町・久松町・堀留町・本石町・本町・室町・横山町)。**area の name には正式町名を採った** — 下流は住所から area を引くため。build は素の名前で ABR を引き、無ければ「日本橋」を前置して引き直し、どちらでも引けなければ止める。"
  - "**繁華街は週6日収集**。京橋・銀座 (1〜8丁目)・日本橋1〜3丁目・八重洲 (1・2丁目) の燃やすごみが「月曜日～土曜日」。加えて**日本橋人形町2丁目1～14番だけが週5日** (月・火・水・金・土)。範囲表記と 5 日並記の両方を parse できないと落ちる。"
  - "**収録期間 2026-01--2026-11 の根拠。** この表は曜日規則だけで日付を持たない。始端はパンフレット「ごみと資源の分け方・出し方」の発行月 (令和8年1月) — HTML にも表にも年度の主張が無いので、4 月起点にすると根拠が慣例だけになる (schema は暦年起点を許す。川口の先例)。終端は 11 月で、**年末年始の記述が公表資料のどこにも無い**ため。区サイト・パンフレット (日英中韓)・年末年始ページのいずれにも記載が無く、公表されている運用ルールは「日曜日は収集しない」だけ (パンフ英語版 `Collection date: No collection on Sundays.` / 中国語版「收集日：星期日不予收集」)。12 月については休止も収集も主張しない。**12 月に告知が出たら期間を延ばすこと。**"
  - "祝日は収集すると読んだ。ソースが収集しない日を列挙していて (日曜のみ)、祝日がそこに無いため。ただし**豊島区の「祝日(年末年始を除く)も資源やごみを収集します」より根拠は弱い** — 中央区は祝日に言及していない。"
  - "**HTML の表示上の更新日 (2023年1月18日) は古いメタデータ。** HTTP の Last-Modified は 2026-07-30 で、パンフレット (令和8年1月発行) より新しい。照合で食い違ったら HTML を正とする、と**差分を見る前に決めた** (江東区で都カタログ CSV が古かった教訓)。実際には不一致 0 だった。"
  - "検証 (2026-09-15): 3 系統。①**パンフレットとの照合** — 「ごみと資源の分け方・出し方」の外国語版に同じ曜日表がテキスト層つきで入っている (日本語版パンフは画像 PDF で読めない。豊島・江東と同じ構図)。英語版・中国語版はそれぞれ別に組版されており、56 行 × 5 品目 × 2 版 = 560 セルで不一致 0。②**版どうしの照合** — 英語版 ↔ 中国語版 280 セルで不一致 0。③**生成物との照合** — HTML と ABR から build とは別の実装で期待 area を組み立て、両方向で集合を比較したうえで収録期間の全日を展開。104 area × 334 日 = 34,736 日枠で不一致 0。改竄 5 通りで各検査が落ちることを確認済み。**うち 1 通りは当初空振りした** — 検査③が HTML 側から生成物を引く片方向だったため、生成物から area を消しても残りが引けて通ってしまった。期待集合を独立に作って両方向で比べる形に直した (江東でも同型の空振りを踏んでいる)。"
  - "**韓国語版パンフレットは照合に使っていない。** 同じ表を持つが機械で安定して読めない — 町名のハングルに曜日と同じ字が混じり (신**토**미 / 미나**토** / 가부**토**초 の「토」= 土)、行の曜日グループが 5 個でなく 6 個になる。さらに「닌교초 (人形町) 2초메1〜14번」の週5日の値が行またぎで分断される。「最後の 5 個を採る」等で辻褄は合わせられるが、**取り繕いが要る検査は検査にならない**ので外した。英語版・中国語版の 2 版で独立性は確保できている。"
  - "確率的信頼度: 独立照合の N は**56 行 × 5 品目 = 280 セル** (1 つの転記・抽出ミスで壊れる最小単位)。英語版・中国語版の 2 版それぞれでゼロ不一致なので、rule of three で **95% 信頼で誤り率 p < 1.1%/セル**。等級は②(独立ソースとの曜日レベル照合) — **日付レベルの照合はできない**。区が日付入りカレンダーを公表しておらず、突き合わせる相手が曜日規則しか無いため。パンフレットは HTML とは別に組版されているが、**同じ原簿から派生している**ので共通原因誤りは残る。町字の網羅検査だけが区の刊行物外 (ABR) と突き合わせている。"
