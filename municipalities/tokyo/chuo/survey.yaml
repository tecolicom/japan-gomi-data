  一次ソース確定: 公式「あなたの町のごみ・資源収集曜日」HTML表 (syuusyuuyoubi.html)。 町丁別に燃やすごみ等の曜日を掲載 (例: 明石町=水土, 新富=月木, 新川=火金, 京橋=月〜土)。 3地域
