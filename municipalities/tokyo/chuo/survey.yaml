notes: '【収録済 2026-09-15】収録した。13 コース・104 area。抽出は tools/html-extractor/chuo/。 一次ソースは公式 HTML 表 (3地域56行)。**照合はパンフレット「ごみと資源の分け方・出し方」の外国語版**
  — 日本語版は画像PDF (27+25ページで54字) だが英語版・中国語版には同じ曜日表がテキスト層つきで入っている (豊島・江東と同じ構図)。韓国語版も同じ表を持つが、町名のハングルに曜日と同じ字が混じり (신토미の「토」=土)
  曜日グループが6個になるうえ 週5日の値が行またぎで分断されるため照合から外した。 【罠】(1) <br> の意味が列で違う — 曜日列では区切り、丁目列では折り返し。(2) パンフの本文の並びが 京橋→月島→日本橋 で
  HTML と違い、位置で突き合わせると 320/560 セル食い違う。(3) rowspan が音と町名で独立。(4) 区が日本橋地域の町名から「日本橋」を省いている (19町33行)。(5) 京橋・銀座・日本橋1〜3丁目・八重洲が週6日「月曜日～土曜日」、日本橋人形町2丁目1〜14番だけ週5日。
  【語彙】資源 = 古紙+ペットボトル+びん+缶+**金属製のなべ・やかん類(metal)**。プラマーク=plastic (資源とは別の日)。粗大ごみは申込制で収録しないが、照合には使う (無料の5列目)。 【収録期間】2026-01--2026-11。始端はパンフの発行月
  (令和8年1月)。**年末年始の記述が公表資料のどこにも無い** (公表されている運用ルールは「日曜日は収集しない」だけ) ため 11 月で切った。 【鮮度】HTML の表示上の更新日 2023-01-18 は古いメタデータで、HTTP
  Last-Modified は 2026-07-30。パンフ (令和8年1月発行) より新しいので、食い違ったら HTML を正とすると事前に決めた。実際は不一致 0。 【下調べ 2026-09-14】23 区整備のため一次ソースを実測した
