notes:   【収録済 2026-09-01】収録した。24 コース (東1〜12・西1〜12)・134 area。抽出は tools/pdf-extractor/itabashi/。

  【サーベイは概ね正確だった】訂正は 2 点のみ。(1) 「地域番号→町丁目対応は要取得」としていたが、**索引ページ (kaishu/1038152.html) 自体がその対応表**だった (町丁目 × 資源/可燃/不燃の曜日 + 地域番号の
  HTML 表・70 行)。(2) 「5375字/1p」は実測 pdftotext 3,002 / pdfplumber chars 1,435。difficulty 3 → 2、source_type pdf → pdf-text へ訂正。

  【一次ソースの構造】各 PDF は (a) テキスト層に曜日規則を明記、(b) 本体は 3 色の塗りセル (ピンク=可燃/緑=資源/シアン=不燃) による通年カレンダー、(c) ヘッダに「地域→町丁目」。索引 HTML が「町丁目→地域」を持つので、地区割を**双方向で照合できる**。

  【語彙】資源(週1回)=プラスチック+古紙+びん+缶+ペットボトルの同日収集、可燃(週3回)、不燃(毎月2回)。7 カテゴリすべて正典語彙に収まる。古着・古布は集団回収で対象外。

  【年末年始】全 24 地域で 2026-12-31・2027-01-01・2027-01-02 のセルだけが空。ただし PDF が「改めてお知らせいたします」と確定を留保しているため unknown_periods (2026-12-31〜2027-01-03) とした。**12 月の告知が出たら overrides へ落とすこと。**

  【未収録】上赤塚町・下赤塚町は ABR に現存するが区の日程資料 (索引表・24 PDF ヘッダ) に一度も現れないため収録していない (被覆 134/136)。

  一次ソースは「地域別 資源回収・ごみ収集曜日カレンダー(令和8年度版)」(kaishu/1038152.html)配下の 地域別カレンダーPDF。東(e01〜e12)+西(w01〜w12)=計24地域、URLは
  /_res/…/001/038/152/r8/w##.pdf および r8/higashi/nishi/e##.pdf。テキスト層あり(pdftotext 成功、5375字/1p、curl 200/403なし)、 日付入り通年カレンダー(令和8年4月〜令和9年3月、日Sun月Mon…のグリッド)で
  granularity=dates。 各PDF冒頭に曜日規則も明記(例 西①=資源:週1土/可燃:週3月水金/不燃:毎月1回目・3回目の木)。 ランディング「資源回収・ごみ収集地域別曜日表」(kaishu/index.html)は地域番号への索引ページで
  HTML曜日表・CSVは持たない(要 地域別一覧表で番号→町丁目対応を取得)。オープンデータは施設位置情報等の CSVのみで収集日データセットは未発見。年末年始はPDF注記に「改めて区HP・区報・集積所看板でお知らせ」
