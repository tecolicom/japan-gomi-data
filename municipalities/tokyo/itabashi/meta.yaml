notes:
  - "区の 3 区分と正典語彙の対応: 「資源」(週1回・5 品目を同日収集) → plastic + paper + glass_bottle + beverage_can + pet_bottle、「可燃ごみ」→ burnable、「不燃ごみ」→ non_burnable。資源の内訳は区「資源とごみの正しい分け方・出し方」(shigen/1001856.html) による — プラスチック(容器包装+製品)、古紙(新聞・雑誌・段ボール・紙パック・紙箱・紙袋・OA用紙)、びん、缶、ペットボトル。語彙の追加は不要だった。"
  - 古着・古布は区の資源に含まれず集団回収 (回収団体ごとに日程が異なる) のため対象外。粗大ごみは申込制のため対象外。
  - "**24 地域を畳んでいない。** 東①〜⑫・西①〜⑫ の曜日規則は 15 通りしかなく 9 組が重複する (e01=w11 / e05=w06 / e06=w05 / e07=w10 / e08=w09 / e09=w07 / e10=w08 / e11=w01 / e12=w02)。規則が同じでも区は別の地域として運用し、清掃事務所の管轄も東西で分かれるので、foldCourses せず区の呼称をそのまま course (e1〜e12 / w1〜w12) と course_name_ja (東1〜西12) にした。"
  - "**年末年始は unknown_periods に置いた (cancelled ではない)。** 24 地域すべてのカレンダーで 2026-12-31・2027-01-01・2027-01-02 のセルだけが空で、12/29・12/30 は通常どおり塗られている。しかし PDF 自身が「年末年始の収集日は、改めて板橋区ホームページ、区報、集積所看板への張り紙でお知らせいたします。」と確定を留保しているため、「収集なし」と断定せず不明区間 (2026-12-31〜2027-01-03) とした。1/3 は日曜で通常収集が無いが振替告知の可能性があるので窓に含めた。**12 月に告知が出たら overrides へ落とすこと。**"
  - "**区が日程を公表していない町字が 2 件ある: 上赤塚町・下赤塚町。** ABR 町字マスターの板橋区 136 件のうち、索引ページの表 (70 行) にも 24 本の PDF ヘッダにも一度も現れない。ABR 上は 1947 年から現存 (status_flg=1・廃止日なし) だが、**推測でデータを作らない**ため収録していない (被覆 134/136)。build がこの 2 件だけを名指しの例外として通し、それ以外の差異では止まる。"
  - 祝日の扱いはカレンダーの実日付がそのまま示している (収録期間内の祝日はすべて通常収集)。曜日規則からの欠けは上記の年末年始 3 日だけで、他に例外は無いことを build が全 24 地域で検査している。
  - "検証 (2026-09-01): 区は同じ日程を 2 通りに公表しており、どちらも機械可読なので相互に照合できる。①**曜日規則の照合** — 索引ページの HTML 表 (町丁目 70 行 × 資源/可燃/不燃) と、24 本の PDF がテキスト層に持つ曜日規則を突き合わせ、210 セルで不一致 0。②**地区割の双方向照合** — 索引ページは「町丁目 → 地域」、各 PDF のヘッダは「地域 → 町丁目」を持つ。区が別々に書いた 2 つの対応表なので係り先の取り違えを検出できる。24 地域 134 町字で不一致 0。③**日付レベルの全数照合** — 索引ページの曜日規則を classifyRules を通さない別経路で展開し、公開した course YAML と収録期間の全日で突き合わせ、24 地域 × 361 日 = 8,664 日枠で不一致 0。加えて build 内で、カレンダーの塗りセルから読んだ実日付と生成 rules の再展開が 8,664 日枠で一致することを自己検証している。改竄 5 通り (町丁目の付け替え / PDF ヘッダの町名削除 / 曜日の書き換え / 第n の追加 / コースの削除) で各検査が落ちることを確認済み。"
  - "確率的信頼度: 独立照合の N は**索引ページの 70 行 × 3 品目 = 210 セル** (1 つの転記・抽出ミスで壊れる最小単位)。ゼロ不一致から rule of three で **95% 信頼で誤り率 p < 1.4%/セル** (行単位なら N=70 で p < 4.3%/行)。地区割は別に N=134 町字で p < 2.2%/町字。等級は①(独立ソースとの日付レベル全数照合) — HTML 表は PDF とは別に組まれた表現で、PDF は塗り色・HTML は文字と読み取り経路も異なる。**残余リスクは共通原因誤り** (区の原簿自体が誤っている場合) で、これは照合を重ねても消えない。町字の網羅検査だけが区の刊行物外 (ABR) と突き合わせている。"
