notes: '★好条件。一次ソースは「ごみ・資源物収集カレンダー(テキスト版)」= 地域別HTMLページ (gomicalender_exel/111.html〜、地域番号1〜8)。調布のテキスト版カレンダーと同種で、 「日付・曜日・品目」を列挙した日付入り通年テキスト(令和7年10月〜令和8年9月の1年、年度でなく10月起点)。
  年末年始も明示(2025/12/29〜31・2026/1/1〜2 は収集なし)=calendar-explicit。granularity=dates、difficulty 2。 地域は8(1=田無町・西原町・芝久保町5丁目/2=緑町・谷戸町1・2丁目・北原町・ひばりが丘/
  3=谷戸町3丁目・東町・泉町・住吉町/7=南町・芝久保町1〜4丁目 …)。分別: びん・スプレー缶・ライター・古紙古布/ 可燃・せん定枝/不燃・有害危険物/等。補助/検証: PDF版カレンダー(999.html)。 収集曜日CSV/JSONは未発見(ページに.txt/.xls/.csv直リンクは無く、テキストはHTML本文として提供)。
  ごみ分別アプリ・分別辞典(gomisaku.jp/0017)あり。ライセンス明示なし=proprietary-site。
  【収録済 2026-08-10】8地域(course=1〜8)を収録期間 2025-10--2026-09 で収録(tools/html-extractor/nishitokyo)。会計年度でなく10月起点1年をそのまま period にした。
  地域別HTMLの月ブロック(h2「YYYY年M月」+直後のtable。日番号行と内容行が交互・各行7セル)を座標でなくセル位置で読み、全8地域×365日を欠落なく取得。
  可燃(週2)・ペットボトル+プラ(週1)は weekly + 年末年始の cancelled、びん類/缶の隔週交替と水曜の4週周期(不燃・有害→金属類→不燃・有害→収集なし)は monthly_specific。
  生成規則を expandRange で再展開して抽出実日付と品目ごと完全一致を自己検証(2920日枠)。
  独立照合は冊子版PDF(999.files/-N-070911.pdf)だが Illustrator アウトライン化でテキスト層なし → 画像から4ヶ月91日枠を層化サンプリングで目視照合、相違ゼロ。
  ⚠地域8のページ title のみ元号が「令和6年10月から令和7年9月まで」と誤記(本文・冊子版PDFはいずれも2025年10月始まり)。ソースは修正せず meta.yaml に記録。
  語彙外: 小型家電→metal(金属類と同一セル)、ライター→spray_can に同梱、廃食用油→除外(金属類と同日)。いずれも他品目と同日で日程情報の欠落なし。
  areas は 22町114丁目を1丁目=1areaで展開、yomi/machiaza_id は ABR 町字マスター(pref13, lg_code 132292)由来。8地域が114町字を重複・欠落なく分割することを build で機械確認。
