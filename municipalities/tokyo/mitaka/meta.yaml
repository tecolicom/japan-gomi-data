notes:
  # course-*.yaml は tools/html-extractor/mitaka が生成する。直したいときは生成器を直して make regen する
  - 市内を 10 地区に分け、地区ごとのページに曜日規則の表が載る。地区は町丁目単位で、ABR の三鷹市 62 町字を重複・欠落なく分割する
  - 可燃ごみは祝日も収集する (年末年始を除く)。収集は当日の朝 8 時まで
  - 「空きびん・缶」「古紙・古着」は市が 1 つの枠として案内する呼称。構成カテゴリへ分解して収録し、同日性は days 共有で表している (taxonomy の groups に呼称を記録)
  - 下連雀3丁目・上連雀2丁目の可燃ごみだけは当日の夜 11 時 30 分までに出す運用 (日程は他と同じ)
  # 年末年始 (HTML に無く、地区別カレンダー PDF にしかない)
  - 12/30・12/31・2027-01-01 は全 10 地区が休止
  - 12/29 (火) は地区で分かれる。火曜が可燃の 5 地区は「可燃は臨時に収集します」と注記があり収集する。残る 5 地区は休止
  - 2027-01-01 (金) が休みになるため、金曜に「第n」枠を持つ 2 地区 (下連雀1〜4丁目・牟礼全域) だけ 1 週繰り下がり、第 5 金曜にも収集がある。他の曜日は影響を受けない
  # 検証記録
  - 2026-08-15 収録。一次ソースは地区別 HTML の曜日規則で、独立照合は地区別カレンダー PDF (日付入り)
  - 年末年始の休止日と注記は PDF のテキスト層から機械抽出し、全 10 地区で設定と一致することを検査 (extract-yearend.py + verify.mjs)
  - 品目マークは 1 枚の画像でテキストにならないため、カレンダー本体は目視転記で照合。繰り下げのある 2 地区の 12 月・1 月を全日 (88 日枠) 転記し不一致 0。転記は verify.mjs の PDF_SAMPLES に固定保持している
  - "確率的信頼度: 独立誤り単位を「地区 × 品目の曜日割当」= 10 地区 × 9 規則 = N=90 とみる。年末年始を含む 88 日枠の目視でゼロ不一致、rule of three で誤り率の上限は約 3.3% (95%)。残余リスクは 4〜11 月・2〜3 月の月次カレンダーを目視していないこと (HTML の曜日規則と PDF が食い違う可能性) で、等級 B とする"
